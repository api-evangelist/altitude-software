name: Altitude Software
description: >-
  Altitude Software is a contact center and unified customer interaction (uCI)
  software company founded in 1993 and headquartered in Lisbon, Portugal. Its
  flagship Altitude uCI suite provides omnichannel contact center capabilities —
  inbound/outbound campaigns, IVR and self-service, routing, dialer, recording
  and quality management, and CRM/ERP integration — with the Altitude uAgent SDK
  exposing Java, C/C++, .NET, SOAP, XML-RPC and web-service APIs for on-premises
  and cloud deployments. Altitude Software was a portfolio company of Insight
  Partners and was acquired by Enghouse Systems (TSX: ENGH) on 2020-12-30; the
  product line is now developed and maintained by Enghouse Interactive, and the
  brand continues to operate regionally (e.g. Altitude Software APAC). The
  company does not publish a modern public REST API, developer portal, or
  OpenAPI specification; integration is delivered through the proprietary uAgent
  SDK and packaged CRM/ERP connectors.
